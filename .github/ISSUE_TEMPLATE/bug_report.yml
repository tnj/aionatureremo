name: Bug report
description: Report a problem with aionatureremo
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: aionatureremo version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and aiohttp versions
      placeholder: "Python 3.13.1, aiohttp 3.13.0"
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: API endpoint / client method involved
      placeholder: "POST /1/appliances/{id}/aircon_settings"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Never include your real access token.
      render: python
