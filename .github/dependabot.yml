version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    ignore:
      # aioresponses (<=0.7.9) is incompatible with aiohttp 3.14's
      # ClientResponse signature; drop this once aioresponses supports it.
      - dependency-name: "aiohttp"
        update-types: ["version-update:semver-minor"]
    groups:
      python-dev:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci(deps)"
