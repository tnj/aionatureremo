[project]
name = "aionatureremo"
version = "0.3.0"
description = "Asynchronous Python client for the Nature Remo Cloud API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Yuki Fujisaki" }]
keywords = ["nature-remo", "nature", "remo", "home-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = ["aiohttp>=3.10.0"]

[project.urls]
Repository = "https://github.com/tnj/aionatureremo"
Issues = "https://github.com/tnj/aionatureremo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aionatureremo"]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
